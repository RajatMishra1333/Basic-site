<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Question 💕</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="heart-background">
            <div class="heart"></div>
            <div class="heart"></div>
            <div class="heart"></div>
        </div>
        
        <div class="content">
            <h1 class="title">Will you be my girlfriend? 💕</h1>
            <div class="emoji">😊</div>
            <div class="button-group">
                <button class="btn btn-yes" onclick="nextPage()">Yes!</button>
                <button class="btn btn-no" id="noBtn" onclick="handleNo()">No</button>
            </div>
        </div>
    </div>
    
    <script src="script.js"></script>
    <script>
        let clickCount = 0;
        function handleNo() {
            clickCount++;
            const noBtn = document.getElementById('noBtn');
            const messages = [
                'Are you sure? 🥺',
                'Really? 😢',
                'Think again! 💔'
            ];
            
            if (clickCount < messages.length) {
                noBtn.textContent = messages[clickCount];
            } else {
                window.location.href = 'page3.html';
            }
        }
    </script>
</body>
</html>
