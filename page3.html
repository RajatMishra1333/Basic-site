<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Please Reconsider 💕</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="heart-background">
            <div class="heart"></div>
            <div class="heart"></div>
            <div class="heart"></div>
        </div>
        
        <div class="content">
            <h1 class="title">Come on, give me a chance! 🥺</h1>
            <div class="emoji">🌟</div>
            <p class="message">I promise to make you smile every day!</p>
            <div class="button-group">
                <button class="btn btn-yes" onclick="nextPage()">Yes!</button>
                <button class="btn btn-no" id="noBtn" onmouseover="runAway(this)">No</button>
            </div>
        </div>
    </div>
    
    <script src="script.js"></script>
    <script>
        function runAway(btn) {
            const maxX = window.innerWidth - btn.offsetWidth - 50;
            const maxY = window.innerHeight - btn.offsetHeight - 50;
            
            const randomX = Math.random() * maxX;
            const randomY = Math.random() * maxY;
            
            btn.style.position = 'absolute';
            btn.style.left = randomX + 'px';
            btn.style.top = randomY + 'px';
        }
    </script>
</body>
</html>
